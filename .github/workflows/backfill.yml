name: Backfill history

# Run this ONCE from the Actions tab (Run workflow) to seed the charts with real
# past prices and anchor the index base. Safe to re-run; it overwrites history + base.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to seed (max 365)"
        default: "180"
        required: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Seed history + base
        run: node backfill-history.mjs
        env:
          COMMODITIES_API_KEY: ${{ secrets.COMMODITIES_API_KEY }}
          DAYS: ${{ inputs.days }}
      - name: Commit
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add data/history.json data/base.json
          git commit -m "backfill: ${{ inputs.days }} days of history" || echo "No changes"
          git push
