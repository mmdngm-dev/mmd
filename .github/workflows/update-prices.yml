name: Update commodity prices

# Runs on GitHub's servers — no computer of yours needs to be on.
on:
  schedule:
    # Every hour, 06:00–20:00 UTC, Monday–Friday (markets hours).
    # Cron is UTC. Nouakchott is UTC+0, so these are local hours too.
    - cron: "0 6-20 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write         # allow the job to commit the refreshed data files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest prices
        run: node updater/fetch-prices.mjs
        env:
          COMMODITIES_API_KEY: ${{ secrets.COMMODITIES_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add data/prices.json data/history.json data/base.json
          git commit -m "prices: $(date -u +%FT%TZ)" || echo "No changes to commit"
          git push
